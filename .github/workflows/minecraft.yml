name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Minecraft Server
        run: |
          mkdir server
          cd server
          wget https://api.papermc.io/v2/projects/paper/versions/1.21.5/builds/24/downloads/paper-1.21.5-24.jar -O paper.jar
          echo "eula=true" > eula.txt

      - name: Download Playit
        run: |
          wget https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit-linux-amd64

      - name: Start Playit
        run: |
          ./playit-linux-amd64

      - name: Start Minecraft Server
        run: |
          cd server
          java -Xms2G -Xmx2G -jar paper.jar nogui
